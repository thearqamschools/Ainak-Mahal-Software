name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run automated tests
        run: python -m unittest discover -q
      - name: Install packager
        run: python -m pip install pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onedir --windowed --name AinakMahal launcher.py
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\AinakMahal.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: AinakMahal-Windows-Installer
          path: output/AinakMahal_Setup.exe
          if-no-files-found: error
